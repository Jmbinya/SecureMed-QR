services:
  - type: web
    name: securemed-qr
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: securemed-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: securemed-db
    plan: free
    databaseName: securemed
    user: securemed
